name: Build IPA for sideloading

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate the iOS project, icons and splash
        run: |
          npx cap add ios
          npx @capacitor/assets generate --ios
          npx cap sync ios

      - name: Info.plist (background audio)
        run: |
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PL"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL"

      - name: Archive without code signing
        run: |
          if [ -d ios/App/App.xcworkspace ]; then TARGET=(-workspace ios/App/App.xcworkspace); else TARGET=(-project ios/App/App.xcodeproj); fi
          xcodebuild "${TARGET[@]}" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="1.0.0" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Package Latchkey.ipa
        run: |
          mkdir -p out/Payload
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" out/Payload/
          cd out && zip -qr Latchkey.ipa Payload && rm -rf Payload && ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: Latchkey-unsigned-ipa
          path: out/Latchkey.ipa
