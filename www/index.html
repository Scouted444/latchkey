<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}

svg{width:20px;height:20px;flex:none}.ico{display:inline-flex}

.btn.pri{background:var(--acc);color:var(--accfg);border-color:transparent}.btn.sm{padding:6px 12px;font-size:13px}.btn.danger{color:#ff5d5d}

#app{display:grid;height:100%;grid-template:"nav main" 1fr "pl pl" auto/232px 1fr}
body.out #app{grid-template:"main" 1fr/1fr}body.out #nav,body.out #player{display:none}
#nav{grid-area:nav;padding:22px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);overflow:auto}

.nb{display:flex;gap:14px;align-items:center;padding:11px 12px;border-radius:12px;color:var(--mut);font-weight:600;width:100%;text-align:left}
.nb:hover{color:var(--fg)}.nb.on{background:var(--s2);color:var(--fg)}.nb.on svg{color:var(--acc)}

.art.lg{width:64px;height:64px;font-size:24px}
.ava{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}.ava img{width:100%;height:100%;object-fit:cover}.ava{aspect-ratio:1}.ava.xl{width:200px;height:200px;min-width:200px;font-size:72px;border:3px solid var(--s2);box-shadow:0 12px 36px -14px var(--glow,#0006)}
.tr{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:14px;cursor:pointer}.tr:hover{background:var(--s1)}.tr.on{background:var(--s2)}.tr.on .t{color:var(--acc)}
.m{flex:1;min-width:0}.t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.d{font-size:13px;color:var(--mut);width:42px;text-align:right}

@property --glow{syntax:'<color>';inherits:true;initial-value:#00000000}
:root{--glow:#00000000;transition:--glow 1s ease}
html{scrollbar-width:thin;scrollbar-color:var(--s2) transparent}
#glow{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.22;background:radial-gradient(60% 50% at 75% 0%,var(--glow),transparent 70%),radial-gradient(45% 40% at 0% 100%,var(--glow),transparent 70%)}
#app{position:relative;z-index:1}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}

@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}

.wrap{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.card{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.auth .card{background:color-mix(in srgb,var(--s1) 75%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}

.hero{background:linear-gradient(90deg,var(--fg) 30%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.tr{animation:up .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*30ms);transition:background .15s,transform .2s}
.noanim .tr{animation:none}.tr:hover{transform:translateX(4px)}
.gc{transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .25s}.gc:hover{transform:translateY(-5px);box-shadow:0 16px 32px -16px var(--acc)}
.ban{height:88px;border-radius:12px;display:grid;place-items:center;font-size:38px;font-weight:800;color:#fff;position:relative;overflow:hidden}
.ban::before,.ban::after{content:"";position:absolute;border-radius:50%;background:#ffffff22;transition:transform .5s}.ban::before{width:90px;height:90px;right:-24px;top:-40px}.ban::after{width:60px;height:60px;left:-14px;bottom:-34px}
.gc:hover .ban::before{transform:scale(1.35)}.gc:hover .ban::after{transform:scale(1.5)}
.btn{transition:transform .15s,box-shadow .2s,background .2s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.96)}.btn.pri{box-shadow:0 8px 22px -10px var(--acc)}.btn.pri:hover{box-shadow:0 10px 28px -8px var(--acc)}
.ib{transition:color .15s,transform .15s,background .15s}.ib:hover{background:var(--s2);transform:scale(1.1)}.ib:active{transform:scale(.88)}.ib.on svg{animation:pop .4s}
.knob{transition:transform .6s cubic-bezier(.2,.8,.2,1)}.logo:hover .knob{transform:rotate(180deg)}
.nb{transition:background .2s,color .2s,transform .2s,box-shadow .2s}.nb:hover{transform:translateX(3px)}.nb.on{box-shadow:inset 3px 0 0 var(--acc)}
.cov{position:relative;flex:none}.cov .ov,.cov .eq{position:absolute;inset:0;border-radius:12px;color:#fff}
.cov .ov{background:#0009;display:grid;place-items:center;opacity:0;transition:opacity .15s}.tr:hover .ov{opacity:1}
.cov .eq{background:#000a;display:none;align-items:flex-end;justify-content:center;gap:3px;padding:11px 14px}.cov .eq i{width:4px;height:20%;background:#fff;border-radius:2px}
.tr.on .eq{display:flex}.tr.on:hover .eq{display:none}
body.playing .eq i{animation:eq .9s ease-in-out infinite}body.playing .eq i:nth-child(2){animation-delay:.25s}body.playing .eq i:nth-child(3){animation-delay:.5s}
.skel{display:flex;flex-direction:column;gap:10px}.skel div{height:62px;border-radius:14px;background:linear-gradient(90deg,var(--s1) 25%,var(--s2) 50%,var(--s1) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite linear}
.empty .ico{display:block;margin:0 auto 10px}.empty svg{width:42px;height:42px;opacity:.45}
#player{background:color-mix(in srgb,var(--s1) 78%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.now{cursor:pointer}#na{transition:border-radius .5s}body.playing #na{border-radius:50%;animation:spin 8s linear infinite}
.play{transition:transform .15s}.play:hover{transform:scale(1.08)}body.playing .play{animation:pulse 1.8s infinite}
input[type=range]{-webkit-appearance:none;appearance:none;height:16px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--acc) var(--p,0%),var(--s2) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--s2)}input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);margin-top:-4.5px;transform:scale(0);transition:transform .15s}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--fg);transform:scale(0);transition:transform .15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{transform:scale(1)}input[type=range]:hover::-moz-range-thumb{transform:scale(1)}
#toast{transform:translate(-50%,16px);transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}#toast.show{transform:translate(-50%,0)}

{const v0=cfg.vol==null?.8:cfg.vol;$('#vol').value=v0;audio.volume=v0;$('#vol').style.setProperty('--p',v0*100+'%')}
